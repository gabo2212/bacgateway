# Phase 1B receive-only nRF52840 bridge.
# This application listens to IEEE 802.15.4 and streams raw PSDUs over USB CDC.

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# USB CDC ACM serial transport.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Keep logging available for local debug, but do not route logs to the bridge
# CDC stream by default because host tools expect binary frames.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=n

# Nordic IEEE 802.15.4 driver direct RX API.
CONFIG_NRF_802154_RADIO_DRIVER=y
CONFIG_NRF_802154_SOURCE_HAL_NORDIC=y

# No network stack, joining, association, shell, or operator command channel.
CONFIG_NETWORKING=n
CONFIG_NET_L2_IEEE802154=n
CONFIG_SHELL=n
