niagara:
  host: "192.168.15.12"
  scheme: "http"
  username_env: "NIAGARA_USER"
  password_env: "NIAGARA_PASS"
  session_env: "NIAGARA_SESSION"
  timeout_sec: 10.0
  login:
    auth_mode: "cookieDigest"  # auto | cookieDigest | scram
    login_path: "/login"
    content_mode: "auto"  # auto | form | json
    support_action_field: "action"
    support_action_first: "sendClientFirstMessage"
    support_action_final: "sendClientFinalMessage"
    support_content_type: "application/x-niagara-login-support"
    client_first_field: "clientFirstMessage"
    server_first_field: "serverFirstMessage"
    client_final_field: "clientFinalMessage"
    server_final_field: "serverFinalMessage"
    hash_algorithms:
      - "sha256"
      - "sha1"

ord:
  room_temp_out: "station:|slot:/Drivers/WirelessTstatNetwork/Device2/points/RoomTemperature/out"
  occ_heat_sp_out: "station:|slot:/Drivers/WirelessTstatNetwork/Device2/points/OccupiedHeatingSetpoint/out"
  occ_cool_sp_out: "station:|slot:/Drivers/WirelessTstatNetwork/Device2/points/OccupiedCoolingSetpoint/out"
  occ_heat_sp_set: "station:|slot:/Drivers/WirelessTstatNetwork/Device2/points/OccupiedHeatingSetpoint/set"
  occ_cool_sp_set: "station:|slot:/Drivers/WirelessTstatNetwork/Device2/points/OccupiedCoolingSetpoint/set"

bacnet:
  bind_ip: "192.168.15.20"
  port: 47808
  device_id: 5001
  device_name: "Niagara ORD Mirror"
  room_temp_ai_instance: 1101
  occ_heat_sp_av_instance: 1201
  occ_cool_sp_av_instance: 1202
  write_min_f: 40.0
  write_max_f: 95.0
  write_rate_limit_sec: 1.0

service:
  poll_interval_sec: 0.5

status_http:
  bind: "127.0.0.1"
  port: 8090
